<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      lang="en">

<head>

    <meta charset="UTF-8">

    <title>User page</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <style>
        .sidebar {
            min-height: calc(100vh - 56px);
        }
    </style>

</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <span class="navbar-text text-white">

        <strong th:text="${user.email}"></strong>

        with roles:

        <span th:each="role : ${user.roles}"
              th:text="${role} + ' '">
        </span>

    </span>

    <form th:action="@{/logout}"
          method="post"
          class="form-inline m-0">

        <button type="submit"
                class="btn btn-link text-secondary nav-link p-0">
            Logout
        </button>

    </form>

</nav>


<div class="container-fluid">

    <div class="row">

        <nav class="col-md-2 d-none d-md-block bg-white sidebar px-0 pt-3">

            <div class="nav flex-column nav-pills">

                <a class="nav-link active rounded-0 pl-3"
                   th:href="@{/user}">
                    User
                </a>

            </div>

        </nav>


        <main role="main"
              class="col-md-10 ml-sm-auto px-4 bg-light pt-3">

            <h1 class="h2">
                User information-page
            </h1>


            <div class="border bg-white mt-3">

                <div class="bg-light p-3 border-bottom">

                    <h5 class="m-0 font-weight-bold">
                        About user
                    </h5>

                </div>


                <div class="p-3">

                    <table class="table table-striped">

                        <thead>

                        <tr>

                            <th>ID</th>
                            <th>First Name</th>
                            <th>Last Name</th>
                            <th>Age</th>
                            <th>Email</th>
                            <th>Role</th>

                        </tr>

                        </thead>


                        <tbody>

                        <tr>

                            <td th:text="${user.id}"></td>

                            <td th:text="${user.name}"></td>

                            <td th:text="${user.lastName}"></td>

                            <td th:text="${user.age}"></td>

                            <td th:text="${user.email}"></td>

                            <td>

                                <span th:each="role : ${user.roles}"
                                      th:text="${role} + ' '">
                                </span>

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </main>

    </div>

</div>

</body>
</html>
