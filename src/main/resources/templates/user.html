<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <title>Информация о пользователе</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>

        body {
            margin: 0;
            padding: 0;
        }

        .navbar {
            min-height: 56px;
        }

        .sidebar {
            min-height: calc(100vh - 56px);
            background-color: #f8f9fa;
            padding: 20px 0;
        }

        .sidebar .nav-link {
            color: #007bff;
        }

        .sidebar .nav-link.active {
            background-color: #007bff;
            color: white;
        }

        .content {
            padding: 20px 30px;
        }

        .table thead th {
            vertical-align: middle;
        }

    </style>

</head>


<body>


<nav class="navbar navbar-dark bg-dark">

    <span class="navbar-text text-white">

        <strong id="user-email">
            user
        </strong>

        с ролями:

        <span id="user-roles">
            USER
        </span>

    </span>


    <form action="/logout"
          method="post"
          class="mb-0">

        <button type="submit"
                class="btn btn-link text-white">

            Выход

        </button>

    </form>

</nav>


<div class="container-fluid">

    <div class="row">


        <div class="col-md-2 sidebar">

            <nav class="nav flex-column">

                <!--
                    Эта ссылка будет скрыта JavaScript,
                    если у пользователя нет ROLE_ADMIN.
                -->

                <a class="nav-link"
                   href="/admin"
                   id="admin-link">

                    Администратор

                </a>


                <a class="nav-link active"
                   href="/user">

                    Пользователь

                </a>

            </nav>

        </div>


        <div class="col-md-10 content">

            <h1 class="mb-4">

                Информация о пользователе

            </h1>


            <div class="card">

                <div class="card-header">

                    О пользователе

                </div>


                <div class="card-body p-0">

                    <table class="table table-striped mb-0">

                        <thead class="thead-light">

                        <tr>

                            <th>ID</th>

                            <th>Имя</th>

                            <th>Фамилия</th>

                            <th>Возраст</th>

                            <th>Электронная почта</th>

                            <th>Роль</th>

                        </tr>

                        </thead>


                        <tbody id="current-user-table">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>


<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>

<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>


<script>

    document.addEventListener(
        'DOMContentLoaded',
        async function () {

            try {

                const response =
                    await fetch(
                        '/api/user/current'
                    );


                if (!response.ok) {

                    throw new Error(
                        'Не удалось загрузить текущего пользователя'
                    );
                }


                const user =
                    await response.json();


                /*
                 * ROLES
                 */
                const roles =
                    (user.roles || [])
                        .map(function (role) {

                            return role.name.replace(
                                'ROLE_',
                                ''
                            );
                        })
                        .join(', ');


                /*
                 * CHECK ADMIN ROLE
                 */
                const isAdmin =
                    (user.roles || [])
                        .some(function (role) {

                            return role.name ===
                                'ROLE_ADMIN';
                        });


                /*
                 * Если это обычный пользователь,
                 * убираем ссылку на Admin.
                 */
                if (!isAdmin) {

                    const adminLink =
                        document.getElementById(
                            'admin-link'
                        );

                    if (adminLink) {

                        adminLink.style.display =
                            'none';
                    }
                }


                /*
                 * NAVBAR
                 */
                document
                    .getElementById(
                        'user-email'
                    )
                    .textContent =
                    user.email;


                document
                    .getElementById(
                        'user-roles'
                    )
                    .textContent =
                    roles;


                /*
                 * USER TABLE
                 */
                document
                    .getElementById(
                        'current-user-table'
                    )
                    .innerHTML = `

                        <tr>

                            <td>
                                ${user.id}
                            </td>

                            <td>
                                ${escapeHtml(
                                    user.name
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    user.lastName
                                )}
                            </td>

                            <td>
                                ${user.age ?? ''}
                            </td>

                            <td>
                                ${escapeHtml(
                                    user.email
                                )}
                            </td>

                            <td>
                                ${escapeHtml(
                                    roles
                                )}
                            </td>

                        </tr>
                    `;


            } catch (error) {

                console.error(error);

            }

        }
    );


    /*
     * HTML ESCAPE
     */
    function escapeHtml(value) {

        if (value === null ||
            value === undefined) {

            return '';
        }

        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

</script>


</body>

</html>
