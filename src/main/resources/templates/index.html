<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
      lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Главная страница</title>
    <style>
        body { font-family: sans-serif; margin: 30px; }
        .nav-link { display: inline-block; margin-top: 15px; padding: 8px 16px; background-color: #007bff; color: white; text-decoration: none; border-radius: 4px; }
        .nav-link:hover { background-color: #0056b3; }
    </style>
</head>
<body>

<h1>Добро пожаловать на главную страницу!</h1>

<!-- Если пользователь не авторизован -->
<div sec:authorize="isAnonymous()">
    <p>Для доступа к личному кабинету войдите в систему.</p>
    <a th:href="@{/login}" class="nav-link">Войти</a>
</div>

<!-- Если пользователь уже авторизован -->
<div sec:authorize="isAuthenticated()">
    <p>Вы вошли как: <strong sec:authentication="name">пользователь</strong></p>

    <div style="display: flex; gap: 10px; align-items: center;">
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" class="nav-link">Панель администратора</a>
        <a sec:authorize="hasAnyRole('USER', 'ADMIN')" th:href="@{/user}" class="nav-link">Личный кабинет</a>

        <!-- Безопасный Logout через POST -->
        <form th:action="@{/logout}" method="POST" style="margin-top: 15px;">
            <button type="submit" style="padding: 8px 16px; cursor: pointer;">Выйти</button>
        </form>
    </div>
</div>

</body>
</html>
