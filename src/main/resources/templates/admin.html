<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin panel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .sidebar { min-height: calc(100vh - 56px); }
    </style>
</head>
<body>

<!-- Навбар -->
<nav class="navbar navbar-dark bg-dark">
    <span class="navbar-text text-white">
        <strong th:text="${currentUser.email}">admin@mail.ru</strong>
        with roles:
        <span th:text="${#strings.arrayJoin(currentUser.roles.![name.replace('ROLE_', '')], ' ')}">ADMIN USER</span>
    </span>
    <form th:action="@{/logout}" method="post" class="form-inline m-0">
        <button type="submit" class="btn btn-link text-secondary nav-link p-0">Logout</button>
    </form>
</nav>

<div class="container-fluid">
    <div class="row">

        <!-- Сайбар -->
        <nav class="col-md-2 d-none d-md-block bg-white sidebar px-0 pt-3">
            <div class="nav flex-column nav-pills">
                <a class="nav-link active rounded-0 pl-3" href="/admin">Admin</a>
                <a class="nav-link rounded-0 pl-3" href="/user">User</a>
            </div>
        </nav>

        <!-- Основной контент -->
        <main role="main" class="col-md-10 ml-sm-auto px-4 bg-light pt-3">
            <h1 class="h2">Admin panel</h1>

            <ul class="nav nav-tabs" id="adminTab" role="tablist">
                <li class="nav-item">
                    <a class="nav-link active" id="users-tab" data-toggle="tab" href="#users-table" role="tab">Users table</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="new-user-tab" data-toggle="tab" href="#new-user" role="tab">New User</a>
                </li>
            </ul>

            <div class="tab-content" id="adminTabContent">

                <!-- Таб 1: Таблица пользователей -->
                <div class="tab-pane fade show active border border-top-0 bg-white" id="users-table" role="tabpanel">
                    <div class="bg-light p-3 border-bottom">
                        <h5 class="m-0 font-weight-bold">All users</h5>
                    </div>
                    <div class="p-3">
                        <table class="table table-striped">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Age</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Edit</th>
                                <th>Delete</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="u : ${users}">
                                <td th:text="${u.id}">1</td>
                                <td th:text="${u.name}">Name</td>
                                <td th:text="${u.lastName}">LastName</td>
                                <td th:text="${u.age}">35</td>
                                <td th:text="${u.email}">user@mail.com</td>
                                <td>
                                    <span th:each="r : ${u.roles}" th:text="${r.name.replace('ROLE_', '')} + ' '">ADMIN</span>
                                </td>
                                <td>
                                    <button class="btn btn-info btn-sm" data-toggle="modal"
                                            th:data-target="${'#editModal' + u.id}">Edit</button>
                                </td>
                                <td>
                                    <button class="btn btn-danger btn-sm" data-toggle="modal"
                                            th:data-target="${'#deleteModal' + u.id}">Delete</button>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

                <!-- Таб 2: Создание нового пользователя -->
                <div class="tab-pane fade border border-top-0 bg-white" id="new-user" role="tabpanel">
                    <div class="bg-light p-3 border-bottom">
                        <h5 class="m-0 font-weight-bold">Add new user</h5>
                    </div>
                    <div class="p-4">
                        <form th:action="@{/admin/save}" th:object="${newUser}" method="POST" class="col-md-4 offset-md-4 text-center font-weight-bold">
                            <div class="form-group">
                                <label for="newName">First name</label>
                                <input type="text" th:field="*{name}" class="form-control" id="newName" required>
                            </div>
                            <div class="form-group">
                                <label for="newLastName">Last name</label>
                                <input type="text" th:field="*{lastName}" class="form-control" id="newLastName" required>
                            </div>
                            <div class="form-group">
                                <label for="newAge">Age</label>
                                <input type="number" th:field="*{age}" class="form-control" id="newAge">
                            </div>
                            <div class="form-group">
                                <label for="newEmail">Email</label>
                                <input type="email" th:field="*{email}" class="form-control" id="newEmail" required>
                            </div>
                            <div class="form-group">
                                <label for="newPassword">Password</label>
                                <input type="password" th:field="*{password}" class="form-control" id="newPassword" required>
                            </div>
                            <div class="form-group">
                                <label for="newRoles">Role</label>
                                <select multiple class="form-control" id="newRoles" th:field="*{roles}" size="2" required>
                                    <option th:each="role : ${allRoles}"
                                            th:value="${role.id}"
                                            th:text="${role.name.replace('ROLE_', '')}">
                                    </option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success btn-lg">Add new user</button>
                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<!-- Модальные окна вынесены за пределы таблицы -->
<div th:each="u : ${users}">

    <!-- Модалка EDIT -->
    <div class="modal fade" th:id="${'editModal' + u.id}" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title font-weight-bold">Edit user</h5>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
                <form th:action="@{/admin/save}" method="POST">
                    <div class="modal-body text-center font-weight-bold col-md-8 offset-md-2">
                        <input type="hidden" name="id" th:value="${u.id}"/>

                        <div class="form-group">
                            <label>ID</label>
                            <input type="text" class="form-control" th:value="${u.id}" disabled/>
                        </div>
                        <div class="form-group">
                            <label>First name</label>
                            <input type="text" name="name" class="form-control" th:value="${u.name}"/>
                        </div>
                        <div class="form-group">
                            <label>Last name</label>
                            <input type="text" name="lastName" class="form-control" th:value="${u.lastName}"/>
                        </div>
                        <div class="form-group">
                            <label>Age</label>
                            <input type="number" name="age" class="form-control" th:value="${u.age}"/>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" name="email" class="form-control" th:value="${u.email}"/>
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" name="password" class="form-control" placeholder="New password"/>
                        </div>
                        <div class="form-group">
                            <label>Role</label>
                            <select multiple class="form-control" name="roles" size="2">
                                <option th:each="role : ${allRoles}"
                                        th:value="${role.id}"
                                        th:text="${role.name.replace('ROLE_', '')}">
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-primary">Edit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Модалка DELETE -->
    <div class="modal fade" th:id="${'deleteModal' + u.id}" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-dialog-centered" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title font-weight-bold">Delete user</h5>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
                <form th:action="@{/admin/delete}" method="POST">
                    <div class="modal-body text-center font-weight-bold col-md-8 offset-md-2">
                        <input type="hidden" name="id" th:value="${u.id}"/>

                        <div class="form-group">
                            <label>ID</label>
                            <input type="text" class="form-control" th:value="${u.id}" disabled/>
                        </div>
                        <div class="form-group">
                            <label>First name</label>
                            <input type="text" class="form-control" th:value="${u.name}" disabled/>
                        </div>
                        <div class="form-group">
                            <label>Last name</label>
                            <input type="text" class="form-control" th:value="${u.lastName}" disabled/>
                        </div>
                        <div class="form-group">
                            <label>Age</label>
                            <input type="number" class="form-control" th:value="${u.age}" disabled/>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" class="form-control" th:value="${u.email}" disabled/>
                        </div>
                        <div class="form-group">
                            <label>Role</label>
                            <select multiple class="form-control" disabled size="2">
                                <option th:each="role : ${u.roles}"
                                        th:text="${role.name.replace('ROLE_', '')}">
                                </option>
                            </select>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
                        <button type="submit" class="btn btn-danger">Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>

</body>
</html>
