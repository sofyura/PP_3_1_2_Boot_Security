<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель администратора</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        .navbar {
            min-height: 56px;
        }

        .sidebar {
            min-height: calc(100vh - 56px);
            background-color: #f8f9fa;
            padding: 20px 0;
        }

        .sidebar .nav-link {
            color: #007bff;
        }

        .sidebar .nav-link.active {
            background-color: #007bff;
            color: white;
        }

        .content {
            padding: 20px 30px;
        }

        .table thead th {
            vertical-align: middle;
        }

        .modal-header {
            justify-content: center;
        }

        .modal-header .close {
            position: absolute;
            right: 15px;
        }

        .role-select {
            min-height: 100px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <span class="navbar-text text-white">
        <strong id="current-user-name">admin</strong>
        с ролями:
        <span id="current-user-roles">ADMIN</span>
    </span>

    <form action="/logout" method="post" class="mb-0">
        <button type="submit" class="btn btn-link text-white">
            Выход
        </button>
    </form>
</nav>

<div class="container-fluid">
    <div class="row">

        <div class="col-md-2 sidebar">
            <nav class="nav flex-column">
                <a class="nav-link active"
                   href="/admin">
                    Администратор
                </a>

                <a class="nav-link"
                   href="/user">
                    Пользователь
                </a>
            </nav>
        </div>

        <div class="col-md-10 content">

            <h1 class="mb-4">
                Панель администратора
            </h1>

            <ul class="nav nav-tabs"
                id="adminTabs"
                role="tablist">

                <li class="nav-item">
                    <a class="nav-link active"
                       id="users-tab"
                       data-toggle="tab"
                       href="#users"
                       role="tab">
                        Таблица пользователей
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link"
                       id="new-user-tab"
                       data-toggle="tab"
                       href="#new-user"
                       role="tab">
                        Новый пользователь
                    </a>
                </li>

            </ul>

            <div class="tab-content"
                 id="adminTabsContent">

                <!-- USERS -->

                <div class="tab-pane fade show active"
                     id="users"
                     role="tabpanel">

                    <div class="card border-top-0 rounded-0">

                        <div class="card-body">

                            <h5 class="card-title">
                                Все пользователи
                            </h5>

                            <table class="table table-striped table-bordered">

                                <thead class="thead-light">

                                <tr>
                                    <th>ID</th>
                                    <th>Имя</th>
                                    <th>Фамилия</th>
                                    <th>Возраст</th>
                                    <th>Электронная почта</th>
                                    <th>Роль</th>
                                    <th>Редактировать</th>
                                    <th>Удалить</th>
                                </tr>

                                </thead>

                                <tbody id="users-table-body">
                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

                <!-- NEW USER -->

                <div class="tab-pane fade"
                     id="new-user"
                     role="tabpanel">

                    <div class="card border-top-0 rounded-0">

                        <div class="card-body">

                            <h5 class="card-title">
                                Добавить нового пользователя
                            </h5>

                            <form id="new-user-form">

                                <div class="form-group">
                                    <label for="name">
                                        Имя
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           id="name"
                                           required>
                                </div>

                                <div class="form-group">
                                    <label for="lastName">
                                        Фамилия
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           id="lastName"
                                           required>
                                </div>

                                <div class="form-group">
                                    <label for="age">
                                        Возраст
                                    </label>

                                    <input type="number"
                                           class="form-control"
                                           id="age"
                                           required>
                                </div>

                                <div class="form-group">
                                    <label for="email">
                                        Электронная почта
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           id="email"
                                           required>
                                </div>

                                <div class="form-group">
                                    <label for="password">
                                        Пароль
                                    </label>

                                    <input type="password"
                                           class="form-control"
                                           id="password"
                                           required>
                                </div>

                                <div class="form-group">
                                    <label for="roles">
                                        Роль
                                    </label>

                                    <select class="form-control role-select"
                                            id="roles"
                                            multiple
                                            required>
                                    </select>
                                </div>

                                <button type="submit"
                                        class="btn btn-success">
                                    Добавить пользователя
                                </button>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>
</div>

<div id="modals-container"></div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>

<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>


<script>

    /*
     * GLOBAL ROLES
     */
    window.allRoles = [];


    /*
     * INITIALIZATION
     */
    document.addEventListener(
        'DOMContentLoaded',
        async function () {

            try {

                await loadCurrentUser();

                await loadRoles();

                await loadUsers();

            } catch (error) {

                console.error(error);

                alert(
                    'Ошибка загрузки данных'
                );
            }

            document
                .getElementById('new-user-form')
                .addEventListener(
                    'submit',
                    createUser
                );
        }
    );


    /*
     * CURRENT USER
     */
    async function loadCurrentUser() {

        const response =
            await fetch('/api/user/current');

        if (!response.ok) {

            throw new Error(
                'Не удалось загрузить текущего пользователя'
            );
        }

        const user =
            await response.json();

        document
            .getElementById('current-user-name')
            .textContent = user.email;

        document
            .getElementById('current-user-roles')
            .textContent = getRolesText(user);
    }


    /*
     * LOAD ROLES
     */
    async function loadRoles() {

        const response =
            await fetch('/api/roles');

        if (!response.ok) {

            throw new Error(
                'Не удалось загрузить роли'
            );
        }

        const roles =
            await response.json();

        /*
         * Сохраняем роли глобально.
         * Они понадобятся модальным окнам редактирования.
         */
        window.allRoles = roles;

        renderRoleOptions(roles);
    }


    /*
     * LOAD USERS
     */
    async function loadUsers() {

        const response =
            await fetch('/api/users');

        if (!response.ok) {

            throw new Error(
                'Не удалось загрузить пользователей'
            );
        }

        const users =
            await response.json();

        renderUsers(users);
    }


    /*
     * RENDER USERS
     */
    function renderUsers(users) {

        const tableBody =
            document.getElementById(
                'users-table-body'
            );

        const modalsContainer =
            document.getElementById(
                'modals-container'
            );

        tableBody.innerHTML = '';

        modalsContainer.innerHTML = '';


        users.forEach(function (user) {

            const row =
                document.createElement('tr');

            row.innerHTML = `

                <td>${user.id}</td>

                <td>${escapeHtml(user.name)}</td>

                <td>${escapeHtml(user.lastName)}</td>

                <td>${user.age ?? ''}</td>

                <td>${escapeHtml(user.email)}</td>

                <td>
                    ${escapeHtml(getRolesText(user))}
                </td>

                <td>
                    <button type="button"
                            class="btn btn-primary"
                            data-toggle="modal"
                            data-target="#editModal${user.id}">
                        Редактировать
                    </button>
                </td>

                <td>
                    <button type="button"
                            class="btn btn-danger"
                            data-toggle="modal"
                            data-target="#deleteModal${user.id}">
                        Удалить
                    </button>
                </td>
            `;

            tableBody.appendChild(row);

            createEditModal(user);

            createDeleteModal(user);
        });
    }


    /*
     * ROLE OPTIONS
     */
    function renderRoleOptions(roles) {

        const select =
            document.getElementById('roles');

        select.innerHTML = '';

        roles.forEach(function (role) {

            const option =
                document.createElement('option');

            option.value = role.id;

            option.textContent =
                role.name.replace(
                    'ROLE_',
                    ''
                );

            select.appendChild(option);
        });
    }


    /*
     * CREATE USER
     */
    async function createUser(event) {

        event.preventDefault();

        const user = {

            name:
                document.getElementById(
                    'name'
                ).value,

            lastName:
                document.getElementById(
                    'lastName'
                ).value,

            age:
                Number(
                    document.getElementById(
                        'age'
                    ).value
                ),

            email:
                document.getElementById(
                    'email'
                ).value,

            password:
                document.getElementById(
                    'password'
                ).value,

            roles:
                getSelectedRoles(
                    document.getElementById(
                        'roles'
                    )
                )
        };


        try {

            const response =
                await fetch(
                    '/api/users',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body:
                            JSON.stringify(user)
                    }
                );


            if (!response.ok) {

                throw new Error(
                    'Не удалось создать пользователя'
                );
            }


            document
                .getElementById(
                    'new-user-form'
                )
                .reset();


            /*
             * Обновляем таблицу без перезагрузки.
             */
            await loadUsers();


            $('#users-tab').tab('show');


        } catch (error) {

            console.error(error);

            alert(
                'Ошибка при создании пользователя'
            );
        }
    }


    /*
     * EDIT MODAL
     */
    function createEditModal(user) {

        const container =
            document.getElementById(
                'modals-container'
            );


        const modal =
            document.createElement('div');

        modal.className =
            'modal fade';

        modal.id =
            `editModal${user.id}`;

        modal.tabIndex = -1;

        modal.setAttribute(
            'role',
            'dialog'
        );


        const roleOptions =
            getAllRoleOptionsForEdit(user);


        modal.innerHTML = `

            <div class="modal-dialog"
                 role="document">

                <div class="modal-content">

                    <div class="modal-header">

                        <h5 class="modal-title">
                            Редактировать пользователя
                        </h5>

                        <button type="button"
                                class="close"
                                data-dismiss="modal">

                            <span>
                                &times;
                            </span>

                        </button>

                    </div>


                    <form id="edit-form-${user.id}">

                        <div class="modal-body">

                            <div class="form-group">

                                <label>ID</label>

                                <input type="text"
                                       class="form-control"
                                       value="${user.id}"
                                       disabled>

                            </div>


                            <div class="form-group">

                                <label>Имя</label>

                                <input type="text"
                                       class="form-control"
                                       id="edit-name-${user.id}"
                                       value="${escapeHtml(user.name)}"
                                       required>

                            </div>


                            <div class="form-group">

                                <label>Фамилия</label>

                                <input type="text"
                                       class="form-control"
                                       id="edit-lastName-${user.id}"
                                       value="${escapeHtml(user.lastName)}"
                                       required>

                            </div>


                            <div class="form-group">

                                <label>Возраст</label>

                                <input type="number"
                                       class="form-control"
                                       id="edit-age-${user.id}"
                                       value="${user.age ?? ''}"
                                       required>

                            </div>


                            <div class="form-group">

                                <label>Электронная почта</label>

                                <input type="text"
                                       class="form-control"
                                       id="edit-email-${user.id}"
                                       value="${escapeHtml(user.email)}"
                                       required>

                            </div>


                            <div class="form-group">

                                <label>Пароль</label>

                                <input type="password"
                                       class="form-control"
                                       id="edit-password-${user.id}"
                                       placeholder="Оставьте пустым, чтобы не менять">

                            </div>


                            <div class="form-group">

                                <label>Роли</label>

                                <select class="form-control role-select"
                                        id="edit-roles-${user.id}"
                                        multiple
                                        required>

                                    ${roleOptions}

                                </select>

                            </div>

                        </div>


                        <div class="modal-footer">

                            <button type="button"
                                    class="btn btn-secondary"
                                    data-dismiss="modal">
                                Закрыть
                            </button>

                            <button type="submit"
                                    class="btn btn-primary">
                                Сохранить
                            </button>

                        </div>

                    </form>

                </div>

            </div>
        `;


        container.appendChild(modal);


        document
            .getElementById(
                `edit-form-${user.id}`
            )
            .addEventListener(
                'submit',
                function (event) {

                    updateUser(
                        event,
                        user.id
                    );
                }
            );
    }


    /*
     * DELETE MODAL
     */
    function createDeleteModal(user) {

        const container =
            document.getElementById(
                'modals-container'
            );


        const modal =
            document.createElement('div');

        modal.className =
            'modal fade';

        modal.id =
            `deleteModal${user.id}`;

        modal.tabIndex = -1;

        modal.setAttribute(
            'role',
            'dialog'
        );


        modal.innerHTML = `

            <div class="modal-dialog"
                 role="document">

                <div class="modal-content">

                    <div class="modal-header">

                        <h5 class="modal-title">
                            Удалить пользователя
                        </h5>

                        <button type="button"
                                class="close"
                                data-dismiss="modal">

                            <span>
                                &times;
                            </span>

                        </button>

                    </div>


                    <div class="modal-body">

                        <p>
                            Вы уверены, что хотите удалить
                            <strong>
                                ${escapeHtml(user.email)}
                            </strong>?
                        </p>

                    </div>


                    <div class="modal-footer">

                        <button type="button"
                                class="btn btn-secondary"
                                data-dismiss="modal">
                            Отмена
                        </button>

                        <button type="button"
                                class="btn btn-danger"
                                id="delete-button-${user.id}">
                            Удалить
                        </button>

                    </div>

                </div>

            </div>
        `;


        container.appendChild(modal);


        document
            .getElementById(
                `delete-button-${user.id}`
            )
            .addEventListener(
                'click',
                function () {

                    deleteUser(
                        user.id
                    );
                }
            );
    }


    /*
     * UPDATE USER
     */
    async function updateUser(
        event,
        id
    ) {

        event.preventDefault();


        const password =
            document
                .getElementById(
                    `edit-password-${id}`
                )
                .value;


        const user = {

            id: id,

            name:
                document
                    .getElementById(
                        `edit-name-${id}`
                    )
                    .value,

            lastName:
                document
                    .getElementById(
                        `edit-lastName-${id}`
                    )
                    .value,

            age:
                Number(
                    document
                        .getElementById(
                            `edit-age-${id}`
                        )
                        .value
                ),

            email:
                document
                    .getElementById(
                        `edit-email-${id}`
                    )
                    .value,

            password: password,

            roles:
                getSelectedRoles(
                    document
                        .getElementById(
                            `edit-roles-${id}`
                        )
                )
        };


        try {

            const response =
                await fetch(
                    '/api/users',
                    {
                        method: 'PUT',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body:
                            JSON.stringify(user)
                    }
                );


            if (!response.ok) {

                throw new Error(
                    'Не удалось обновить пользователя'
                );
            }


            $(`#editModal${id}`)
                .modal('hide');


            await loadUsers();


        } catch (error) {

            console.error(error);

            alert(
                'Ошибка при обновлении пользователя'
            );
        }
    }


    /*
     * DELETE USER
     */
    async function deleteUser(id) {

        try {

            const response =
                await fetch(
                    `/api/users/${id}`,
                    {
                        method: 'DELETE'
                    }
                );


            if (!response.ok) {

                throw new Error(
                    'Не удалось удалить пользователя'
                );
            }


            $(`#deleteModal${id}`)
                .modal('hide');


            await loadUsers();


        } catch (error) {

            console.error(error);

            alert(
                'Ошибка при удалении пользователя'
            );
        }
    }


    /*
     * SELECTED ROLES
     */
    function getSelectedRoles(select) {

        return Array
            .from(
                select.selectedOptions
            )
            .map(function (option) {

                return {
                    id: Number(
                        option.value
                    )
                };
            });
    }


    /*
     * ALL ROLE OPTIONS FOR EDIT
     */
    function getAllRoleOptionsForEdit(user) {

        const userRoleIds =
            new Set(
                (user.roles || [])
                    .map(function (role) {
                        return role.id;
                    })
            );


        return window.allRoles
            .map(function (role) {

                const selected =
                    userRoleIds.has(
                        role.id
                    )
                        ? 'selected'
                        : '';

                return `
                    <option value="${role.id}"
                            ${selected}>
                        ${escapeHtml(
                            role.name.replace(
                                'ROLE_',
                                ''
                            )
                        )}
                    </option>
                `;
            })
            .join('');
    }


    /*
     * ROLES TEXT
     */
    function getRolesText(user) {

        return (user.roles || [])
            .map(function (role) {

                return role.name.replace(
                    'ROLE_',
                    ''
                );
            })
            .join(', ');
    }


    /*
     * HTML ESCAPE
     */
    function escapeHtml(value) {

        if (value === null ||
            value === undefined) {

            return '';
        }

        return String(value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#039;');
    }

</script>

</body>
</html>
