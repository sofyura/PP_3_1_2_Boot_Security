<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin panel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .sidebar { min-height: calc(100vh - 56px); }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <span class="navbar-text text-white">
        <strong id="navbar-email"></strong> with roles: <span id="navbar-roles"></span>
    </span>
    <form th:action="@{/logout}" method="post" class="form-inline m-0">
        <button type="submit" class="btn btn-link text-secondary nav-link p-0">Logout</button>
    </form>
</nav>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-2 d-none d-md-block bg-white sidebar px-0 pt-3">
            <div class="nav flex-column nav-pills">
                <a class="nav-link active rounded-0 pl-3" href="/admin">Admin</a>
                <a class="nav-link rounded-0 pl-3" href="/user">User</a>
            </div>
        </nav>

        <main role="main" class="col-md-10 ml-sm-auto px-4 bg-light pt-3">
            <h1 class="h2">Admin panel</h1>

            <ul class="nav nav-tabs" id="adminTab" role="tablist">
                <li class="nav-item">
                    <a class="nav-link active" id="users-tab" data-toggle="tab" href="#users-table" role="tab">Users table</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="new-user-tab" data-toggle="tab" href="#new-user" role="tab">New User</a>
                </li>
            </ul>

            <div class="tab-content" id="adminTabContent">

                <div class="tab-pane fade show active border border-top-0 bg-white" id="users-table" role="tabpanel">
                    <div class="bg-light p-3 border-bottom">
                        <h5 class="m-0 font-weight-bold">All users</h5>
                    </div>
                    <div class="p-3">
                        <table class="table table-striped">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Age</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Edit</th>
                                <th>Delete</th>
                            </tr>
                            </thead>
                            <tbody id="usersTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>

                <div class="tab-pane fade border border-top-0 bg-white" id="new-user" role="tabpanel">
                    <div class="bg-light p-3 border-bottom">
                        <h5 class="m-0 font-weight-bold">Add new user</h5>
                    </div>
                    <div class="p-4">
                        <form id="newUserForm" class="col-md-4 offset-md-4 text-center font-weight-bold">
                            <div class="form-group">
                                <label for="newName">First name</label>
                                <input type="text" class="form-control" id="newName" required>
                            </div>
                            <div class="form-group">
                                <label for="newLastName">Last name</label>
                                <input type="text" class="form-control" id="newLastName" required>
                            </div>
                            <div class="form-group">
                                <label for="newAge">Age</label>
                                <input type="number" class="form-control" id="newAge">
                            </div>
                            <div class="form-group">
                                <label for="newEmail">Email</label>
                                <input type="email" class="form-control" id="newEmail" required>
                            </div>
                            <div class="form-group">
                                <label for="newPassword">Password</label>
                                <input type="password" class="form-control" id="newPassword" required>
                            </div>
                            <div class="form-group">
                                <label for="newRoles">Role</label>
                                <select multiple class="form-control" id="newRoles" size="2" required>
                                    <option value="1">ADMIN</option>
                                    <option value="2">USER</option>
                                </select>
                            </div>
                            <button type="submit" class="btn btn-success btn-lg">Add new user</button>
                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title font-weight-bold">Edit user</h5>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <form id="editUserForm">
                <div class="modal-body text-center font-weight-bold col-md-8 offset-md-2">
                    <div class="form-group">
                        <label>ID</label>
                        <input type="text" id="editId" class="form-control" readonly/>
                    </div>
                    <div class="form-group">
                        <label>First name</label>
                        <input type="text" id="editName" class="form-control"/>
                    </div>
                    <div class="form-group">
                        <label>Last name</label>
                        <input type="text" id="editLastName" class="form-control"/>
                    </div>
                    <div class="form-group">
                        <label>Age</label>
                        <input type="number" id="editAge" class="form-control"/>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="editEmail" class="form-control"/>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="editPassword" class="form-control" placeholder="New password"/>
                    </div>
                    <div class="form-group">
                        <label>Role</label>
                        <select multiple class="form-control" id="editRoles" size="2">
                            <option value="1">ADMIN</option>
                            <option value="2">USER</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal" id="editModalClose">Close</button>
                    <button type="submit" class="btn btn-primary">Edit</button>
                </div>
            </form>
        </div>
    </div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title font-weight-bold">Delete user</h5>
                <button type="button" class="close" data-dismiss="modal">&times;</button>
            </div>
            <form id="deleteUserForm">
                <div class="modal-body text-center font-weight-bold col-md-8 offset-md-2">
                    <div class="form-group">
                        <label>ID</label>
                        <input type="text" id="deleteId" class="form-control" disabled/>
                    </div>
                    <div class="form-group">
                        <label>First name</label>
                        <input type="text" id="deleteName" class="form-control" disabled/>
                    </div>
                    <div class="form-group">
                        <label>Last name</label>
                        <input type="text" id="deleteLastName" class="form-control" disabled/>
                    </div>
                    <div class="form-group">
                        <label>Age</label>
                        <input type="number" id="deleteAge" class="form-control" disabled/>
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="deleteEmail" class="form-control" disabled/>
                    </div>
                    <div class="form-group">
                        <label>Role</label>
                        <select multiple class="form-control" id="deleteRoles" size="2" disabled>
                            <option value="1">ADMIN</option>
                            <option value="2">USER</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-dismiss="modal" id="deleteModalClose">Close</button>
                    <button type="submit" class="btn btn-danger">Delete</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        loadCurrentUser();
        loadAllUsers();

        // 1. Загрузка текущего пользователя в Navbar
        function loadCurrentUser() {
            fetch('/api/user/current')
                .then(res => res.json())
                .then(user => {
                    document.getElementById('navbar-email').textContent = user.email;
                    document.getElementById('navbar-roles').textContent = user.roles.map(r => r.name.replace('ROLE_', '')).join(' ');
                });
        }

        // 2. Загрузка всей таблицы пользователей
        function loadAllUsers() {
            fetch('/api/users')
                .then(res => res.json())
                .then(users => {
                    let rows = '';
                    users.forEach(u => {
                        const roles = u.roles.map(r => r.name.replace('ROLE_', '')).join(' ');
                        rows += `
                            <tr>
                                <td>${u.id}</td>
                                <td>${u.name}</td>
                                <td>${u.lastName}</td>
                                <td>${u.age || ''}</td>
                                <td>${u.email}</td>
                                <td>${roles}</td>
                                <td>
                                    <button class="btn btn-info btn-sm" onclick="openEditModal(${u.id})">Edit</button>
                                </td>
                                <td>
                                    <button class="btn btn-danger btn-sm" onclick="openDeleteModal(${u.id})">Delete</button>
                                </td>
                            </tr>
                        `;
                    });
                    document.getElementById('usersTableBody').innerHTML = rows;
                });
        }

        // 3. Добавление нового пользователя
        document.getElementById('newUserForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const selectedRoles = Array.from(document.getElementById('newRoles').selectedOptions).map(opt => ({
                id: opt.value,
                name: opt.value == 1 ? 'ROLE_ADMIN' : 'ROLE_USER'
            }));

            const newUser = {
                name: document.getElementById('newName').value,
                lastName: document.getElementById('newLastName').value,
                age: document.getElementById('newAge').value,
                email: document.getElementById('newEmail').value,
                password: document.getElementById('newPassword').value,
                roles: selectedRoles
            };

            fetch('/api/users', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newUser)
            }).then(() => {
                document.getElementById('newUserForm').reset();
                $('#users-tab').tab('show'); // Переход на вкладку таблицы
                loadAllUsers();
            });
        });

        // 4. Открытие и заполнение модалки EDIT
        window.openEditModal = function(id) {
            fetch(`/api/users/${id}`)
                .then(res => res.json())
                .then(u => {
                    document.getElementById('editId').value = u.id;
                    document.getElementById('editName').value = u.name;
                    document.getElementById('editLastName').value = u.lastName;
                    document.getElementById('editAge').value = u.age;
                    document.getElementById('editEmail').value = u.email;
                    document.getElementById('editPassword').value = '';
                    $('#editModal').modal('show');
                });
        };

        // Отправка формы EDIT (PUT)
        document.getElementById('editUserForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const selectedRoles = Array.from(document.getElementById('editRoles').selectedOptions).map(opt => ({
                id: opt.value,
                name: opt.value == 1 ? 'ROLE_ADMIN' : 'ROLE_USER'
            }));

            const updatedUser = {
                id: document.getElementById('editId').value,
                name: document.getElementById('editName').value,
                lastName: document.getElementById('editLastName').value,
                age: document.getElementById('editAge').value,
                email: document.getElementById('editEmail').value,
                password: document.getElementById('editPassword').value,
                roles: selectedRoles
            };

            fetch('/api/users', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedUser)
            }).then(() => {
                $('#editModal').modal('hide');
                loadAllUsers();
            });
        });

        // 5. Открытие и заполнение модалки DELETE
        window.openDeleteModal = function(id) {
            fetch(`/api/users/${id}`)
                .then(res => res.json())
                .then(u => {
                    document.getElementById('deleteId').value = u.id;
                    document.getElementById('deleteName').value = u.name;
                    document.getElementById('deleteLastName').value = u.lastName;
                    document.getElementById('deleteAge').value = u.age;
                    document.getElementById('deleteEmail').value = u.email;
                    $('#deleteModal').modal('show');
                });
        };

        // Отправка формы DELETE
        document.getElementById('deleteUserForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const id = document.getElementById('deleteId').value;

            fetch(`/api/users/${id}`, {
                method: 'DELETE'
            }).then(() => {
                $('#deleteModal').modal('hide');
                loadAllUsers();
            });
        });
    });
</script>
</body>
</html>
