<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="https://www.thymeleaf.org"
      lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Панель администратора</title>
    <style>
        body { font-family: sans-serif; margin: 30px; }
        table { border-collapse: collapse; width: 100%; margin-bottom: 30px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        form { margin-bottom: 20px; max-width: 400px; }
        .form-group { margin-bottom: 10px; }
        label { display: block; margin-bottom: 3px; }
        input, select { width: 100%; padding: 6px; box-sizing: border-box; }
        button { padding: 8px 12px; cursor: pointer; }
    </style>
</head>
<body>

<div style="display: flex; justify-content: space-between; align-items: center;">
    <h1>Панель администратора</h1>
    <form th:action="@{/logout}" method="POST" style="margin: 0;">
        <button type="submit">Выйти</button>
    </form>
</div>

<hr/>

<h3>Список пользователей</h3>
<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Имя</th>
        <th>Фамилия</th>
        <th>Email</th>
        <th>Роли</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="u : ${users}">
        <td th:text="${u.id}">1</td>
        <td th:text="${u.name}">User</td>
        <td th:text="${u.lastName}">Userov</td>
        <td th:text="${u.email}">user@mail.com</td>
        <td>
            <span th:each="r : ${u.roles}" th:text="${r.name.replace('ROLE_', '')} + ' '">USER</span>
        </td>
        <td style="display: flex; gap: 8px;">
            <a th:href="@{/admin(id=${u.id})}">Изменить</a>
            <form th:action="@{/admin/delete}" method="POST" style="margin: 0;">
                <input type="hidden" name="id" th:value="${u.id}"/>
                <button type="submit" onclick="return confirm('Удалить?')">Удалить</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<h3>Форма пользователя (Добавление / Редактирование)</h3>
<form th:action="@{/admin/save}" th:object="${user}" method="POST">
    <input type="hidden" th:field="*{id}"/>

    <div class="form-group">
        <label>Имя:</label>
        <input type="text" th:field="*{name}" required/>
    </div>
    <div class="form-group">
        <label>Фамилия:</label>
        <input type="text" th:field="*{lastName}" required/>
    </div>
    <div class="form-group">
        <label>Email (Логин):</label>
        <input type="email" th:field="*{email}" required/>
    </div>
    <div class="form-group">
        <label>Пароль:</label>
        <input type="password" th:field="*{password}"/>
    </div>
    <div class="form-group">
        <label>Роли:</label>
        <select th:field="*{roles}" multiple="multiple" required size="2">
            <option th:each="role : ${allRoles}"
                    th:value="${role.id}"
                    th:text="${role.name.replace('ROLE_', '')}">
            </option>
        </select>
    </div>

    <button type="submit">Сохранить</button>
</form>

</body>
</html>
