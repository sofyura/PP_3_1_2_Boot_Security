<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin panel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .sidebar {
            min-height: calc(100vh - 56px);
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <span class="navbar-text text-white">
        <strong th:text="${currentUser != null ? currentUser.email : #authentication.name}">admin@mail.ru</strong>
        with roles:
        <span th:text="${currentUser != null ? #strings.arrayJoin(currentUser.roles.![name.replace('ROLE_', '')], ' ') : #authentication.authorities}">ADMIN USER</span>
    </span>
    <form th:action="@{/logout}" method="post" class="form-inline m-0">
        <button type="submit" class="btn btn-link text-secondary nav-link p-0">Logout</button>
    </form>
</nav>

<div class="container-fluid">
    <div class="row">

        <nav class="col-md-2 d-none d-md-block bg-white sidebar px-0 pt-3">
            <div class="nav flex-column nav-pills">
                <a class="nav-link active rounded-0 pl-3" href="/admin">Admin</a>
                <a class="nav-link rounded-0 pl-3" href="/user">User</a>
            </div>
        </nav>

        <main role="main" class="col-md-10 ml-sm-auto px-4 bg-light pt-3">
            <h1 class="h2">Admin panel</h1>

            <ul class="nav nav-tabs" id="adminTab" role="tablist">
                <li class="nav-item">
                    <a class="nav-link active" id="users-tab" data-toggle="tab" href="#users-table" role="tab">Users table</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="new-user-tab" data-toggle="tab" href="#new-user" role="tab">New User</a>
                </li>
            </ul>

            <div class="tab-content" id="adminTabContent">

                <div class="tab-pane fade show active border border-top-0 bg-white" id="users-table" role="tabpanel">
                    <div class="bg-light p-3 border-bottom">
                        <h5 class="m-0 font-weight-bold">All users</h5>
                    </div>
                    <div class="p-3">
                        <table class="table table-striped">
                            <thead>
                            <tr>
                                <th>ID</th>
                                <th>First Name</th>
                                <th>Last Name</th>
                                <th>Age</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Edit</th>
                                <th>Delete</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="u : ${users}">
                                <td th:text="${u.id}">1</td>
                                <td th:text="${u.name}">Name</td>
                                <td th:text="${u.lastName}">LastName</td>
                                <td th:text="${u.age}">35</td>
                                <td th:text="${u.email}">user@mail.com</td>
                                <td>
                                    <span th:each="r : ${u.roles}" th:text="${r.name.replace('ROLE_', '')} + ' '">ADMIN </span>
                                </td>
                                <td>
                                    <button class="btn btn-info btn-sm" data-toggle="modal"
                                            th:data-target="${'#editModal' + u.id}">Edit</button>
                                </td>
                                <td>
                                    <button class="btn btn-danger btn-sm" data-toggle="modal"
                                            th:data-target="${'#deleteModal' + u.id}">Delete</button>
                                </td>

                                <div class="modal fade" th:id="${'editModal' + u.id}" tabindex="-1" role="dialog">
                                    <div class="modal-dialog modal-dialog-centered" role="document">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h5 class="modal-title font-weight-bold">Edit user</h5>
                                                <button type="button" class="close" data-dismiss="modal">&times;</button>
                                            </div>
                                            <form th:action="@{/admin/save}" method="POST">
                                                <div class="modal-body text-center font-weight-bold col-md-8 offset-md-2">
                                                    <input type="hidden" name="id" th:value="${u.id}"/>

                                                    <div class="form-group">
                                                        <label>ID</label>
                                                        <input type="text" class="form-control" th:value="${u.id}" disabled/>
                                                    </div>
                                                    <div class="form-group">
                                                        <label>First name</label>
                                                        <input type="text
