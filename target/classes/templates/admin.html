<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <style>
        body{margin:0;padding:0}.navbar{min-height:56px}.sidebar{min-height:calc(100vh - 56px);background:#f8f9fa;padding:20px 0}
        .sidebar .nav-link{color:#007bff}.sidebar .nav-link.active{background:#007bff;color:#fff}.content{padding:20px 30px}
        .table thead th{vertical-align:middle}.modal-header{justify-content:center}.modal-header .close{position:absolute;right:15px}.role-select{min-height:100px}
    </style>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <span class="navbar-text text-white"><strong id="currentUserName">admin</strong> with roles: <span id="currentUserRoles"></span></span>
    <form action="/logout" method="post" class="mb-0"><button type="submit" class="btn btn-link text-white">Logout</button></form>
</nav>
<div class="container-fluid"><div class="row">
    <div class="col-md-2 sidebar"><nav class="nav flex-column">
        <a class="nav-link active" href="/admin">Admin</a><a class="nav-link" href="/user">User</a>
    </nav></div>
    <div class="col-md-10 content">
        <h1 class="mb-4">Admin panel</h1>
        <ul class="nav nav-tabs" id="adminTabs" role="tablist">
            <li class="nav-item"><a class="nav-link active" id="users-tab" data-toggle="tab" href="#users" role="tab">Users table</a></li>
            <li class="nav-item"><a class="nav-link" id="new-user-tab" data-toggle="tab" href="#new-user" role="tab">New User</a></li>
        </ul>
        <div class="tab-content">
            <div class="tab-pane fade show active" id="users" role="tabpanel">
                <div class="card border-top-0 rounded-0"><div class="card-body">
                    <h5 class="card-title">All users</h5>
                    <div id="apiError" class="alert alert-danger d-none"></div>
                    <table class="table table-striped table-bordered">
                        <thead class="thead-light"><tr><th>ID</th><th>First Name</th><th>Last Name</th><th>Age</th><th>Email</th><th>Role</th><th>Edit</th><th>Delete</th></tr></thead>
                        <tbody id="usersTableBody"></tbody>
                    </table>
                </div></div>
            </div>
            <div class="tab-pane fade" id="new-user" role="tabpanel">
                <div class="card border-top-0 rounded-0"><div class="card-body">
                    <h5 class="card-title">Add new user</h5>
                    <form id="createUserForm">
                        <div class="form-group"><label>First name</label><input class="form-control" name="name" required></div>
                        <div class="form-group"><label>Last name</label><input class="form-control" name="lastName" required></div>
                        <div class="form-group"><label>Age</label><input type="number" class="form-control" name="age" required></div>
                        <div class="form-group"><label>Email</label><input class="form-control" name="email" required></div>
                        <div class="form-group"><label>Password</label><input type="password" class="form-control" name="password" required></div>
                        <div class="form-group"><label>Role</label><select class="form-control role-select" name="roles" multiple required></select></div>
                        <button type="submit" class="btn btn-success">Add new user</button>
                    </form>
                </div></div>
            </div>
        </div>
    </div>
</div></div>

<div class="modal fade" id="editModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog" role="document"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Edit user</h5><button type="button" class="close" data-dismiss="modal"><span>&times;</span></button></div>
        <form id="editUserForm"><div class="modal-body">
            <input type="hidden" name="id">
            <div class="form-group"><label>First name</label><input class="form-control" name="name" required></div>
            <div class="form-group"><label>Last name</label><input class="form-control" name="lastName" required></div>
            <div class="form-group"><label>Age</label><input type="number" class="form-control" name="age" required></div>
            <div class="form-group"><label>Email</label><input class="form-control" name="email" required></div>
            <div class="form-group"><label>Password</label><input type="password" class="form-control" name="password" placeholder="Leave blank to keep current password"></div>
            <div class="form-group"><label>Role</label><select class="form-control role-select" name="roles" multiple required></select></div>
        </div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button><button type="submit" class="btn btn-primary">Edit</button></div></form>
    </div></div>
</div>

<div class="modal fade" id="deleteModal" tabindex="-1" role="dialog" aria-hidden="true">
    <div class="modal-dialog" role="document"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title">Delete user</h5><button type="button" class="close" data-dismiss="modal"><span>&times;</span></button></div>
        <div class="modal-body">Are you sure you want to delete <strong id="deleteUserEmail"></strong>?</div>
        <div class="modal-footer"><button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button><button type="button" id="confirmDelete" class="btn btn-danger">Delete</button></div>
    </div></div>
</div>

<script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
<script>
const usersUrl = '/api/users';
let users = [];
let roles = [];
let userToDelete = null;

const apiError = document.getElementById('apiError');
const tableBody = document.getElementById('usersTableBody');
const createForm = document.getElementById('createUserForm');
const editForm = document.getElementById('editUserForm');
const currentUserName = document.getElementById('currentUserName');
const currentUserRoles = document.getElementById('currentUserRoles');

async function request(url, options = {}) {
    const response = await fetch(url, {headers: {'Content-Type': 'application/json'}, ...options});
    if (!response.ok) throw new Error(await response.text() || `HTTP ${response.status}`);
    return response.status === 204 ? null : response.json();
}

function showError(error) {
    apiError.textContent = error.message || 'Request failed';
    apiError.classList.remove('d-none');
}
function hideError() { apiError.classList.add('d-none'); }
function roleNames(user) { return user.roles.map(role => role.name).join(', '); }

function renderUsers() {
    tableBody.innerHTML = users.map(user => `
        <tr>
            <td>${user.id}</td><td>${escapeHtml(user.name)}</td><td>${escapeHtml(user.lastName)}</td>
            <td>${user.age}</td><td>${escapeHtml(user.email)}</td><td>${escapeHtml(roleNames(user))}</td>
            <td><button type="button" class="btn btn-primary edit-btn" data-id="${user.id}">Edit</button></td>
            <td><button type="button" class="btn btn-danger delete-btn" data-id="${user.id}">Delete</button></td>
        </tr>`).join('');
}
function escapeHtml(value) { return String(value ?? '').replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }

function fillRoleSelect(select, selectedIds = []) {
    select.innerHTML = roles.map(role => `<option value="${role.id}" ${selectedIds.includes(role.id) ? 'selected' : ''}>${escapeHtml(role.name)}</option>`).join('');
}
function formData(form) {
    const data = new FormData(form);
    return {
        name: data.get('name'), lastName: data.get('lastName'), age: Number(data.get('age')),
        email: data.get('email'), password: data.get('password'),
        roleIds: Array.from(form.querySelector('[name="roles"]').selectedOptions).map(option => Number(option.value))
    };
}

async function loadData() {
    hideError();
    try {
        [users, roles] = await Promise.all([request(usersUrl), request('/api/roles')]);
        const currentUser = await request('/api/user');
        currentUserName.textContent = currentUser.email;
        currentUserRoles.textContent = currentUser.roles.map(role => role.name).join(', ');
        renderUsers();
        document.querySelectorAll('[name="roles"]').forEach(select => fillRoleSelect(select));
    } catch (error) { showError(error); }
}

tableBody.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button) return;
    const user = users.find(item => item.id === Number(button.dataset.id));
    if (!user) return;
    if (button.classList.contains('edit-btn')) {
        editForm.elements.id.value = user.id;
        editForm.elements.name.value = user.name;
        editForm.elements.lastName.value = user.lastName;
        editForm.elements.age.value = user.age;
        editForm.elements.email.value = user.email;
        editForm.elements.password.value = '';
        fillRoleSelect(editForm.elements.roles, user.roles.map(role => role.id));
        $('#editModal').modal('show');
    } else {
        userToDelete = user.id;
        document.getElementById('deleteUserEmail').textContent = user.email;
        $('#deleteModal').modal('show');
    }
});

createForm.addEventListener('submit', async event => {
    event.preventDefault();
    hideError();
    try {
        await request(usersUrl, {method: 'POST', body: JSON.stringify(formData(createForm))});
        createForm.reset();
        document.getElementById('users-tab').click();
        await loadData();
    } catch (error) { showError(error); }
});

editForm.addEventListener('submit', async event => {
    event.preventDefault();
    hideError();
    try {
        const id = editForm.elements.id.value;
        await request(`${usersUrl}/${id}`, {method: 'PUT', body: JSON.stringify(formData(editForm))});
        $('#editModal').modal('hide');
        await loadData();
    } catch (error) { showError(error); }
});

document.getElementById('confirmDelete').addEventListener('click', async () => {
    hideError();
    try {
        await request(`${usersUrl}/${userToDelete}`, {method: 'DELETE'});
        $('#deleteModal').modal('hide');
        await loadData();
    } catch (error) { showError(error); }
});

loadData();
</script>
</body>
</html>
